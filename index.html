<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <meta name="theme-color" content="#0D0D0D"/>
  <title>Piano Play</title>
  <link rel="manifest" href="manifest.json"/>
  <link rel="apple-touch-icon" href="icons/icon-192.png"/>
  <link rel="stylesheet" href="css/style.css?v=20260614095056"/>
</head>
<body class="theme-dark" data-screen="library">

<div id="update-banner" class="update-banner hidden">
  New version available — <button id="btn-update-reload">Reload</button>
</div>

<!-- ═══════════ LIBRARY ═══════════ -->
<div id="screen-library" class="screen active">
  <header class="app-header">
    <div class="brand">
      <span class="brand-keys" aria-hidden="true">
        <span class="bk w"></span><span class="bk b"></span><span class="bk w"></span>
        <span class="bk b"></span><span class="bk w"></span><span class="bk w"></span>
        <span class="bk b"></span>
      </span>
      <span class="brand-name">Piano Play</span><span style="font-size:9px;color:#555;margin-left:6px">v4j · 2026-06-14T09:50Z
    </div>
    <div class="header-actions">
      <button class="btn-icon" id="btn-theme" title="Toggle theme" aria-label="Toggle theme">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
      </button>
      <button class="btn-icon" id="btn-import-open" title="Import" aria-label="Import piece">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
      </button>
    </div>
  </header>

  <div class="toolbar">
    <div class="search-wrap">
      <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="search" class="search-input" id="lib-search" placeholder="Search pieces…" aria-label="Search"/>
    </div>
    <div class="filter-chips" id="filter-chips">
      <button class="chip active" data-filter="all">All</button>
      <button class="chip" data-filter="1">Beginner</button>
      <button class="chip" data-filter="2">Easy</button>
      <button class="chip" data-filter="3">Intermediate</button>
      <button class="chip" data-filter="4">Advanced</button>
    </div>
  </div>

  <main class="library-grid" id="library-grid"></main>
  <div class="library-empty hidden" id="library-empty">
    <div class="empty-icon">𝄞</div>
    <p class="empty-title">No pieces yet</p>
    <p class="empty-sub">Import a MusicXML file to get started</p>
    <button class="btn-primary" id="btn-import-empty">Import piece</button>
  </div>
</div>

<!-- ═══════════ PRACTICE ═══════════ -->
<div id="screen-practice" class="screen">
  <div class="practice-layout">

    <div class="score-header">
      <button class="btn-icon" id="btn-back" aria-label="Back" onclick="Player.stop();Keyboard.clearNotes();document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById('screen-library').classList.add('active');">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
      <div class="score-meta">
        <span class="score-title"  id="score-title">—</span>
        <span class="score-composer" id="score-composer">—</span>
      </div>
      <button class="btn-icon" id="btn-fullscreen" aria-label="Full screen" title="Full screen">
        <svg id="icon-fs-enter" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/></svg>
        <svg id="icon-fs-exit" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="hidden"><polyline points="4 14 10 14 10 20"/><polyline points="20 10 14 10 14 4"/><line x1="10" y1="14" x2="3" y2="21"/><line x1="21" y1="3" x2="14" y2="10"/></svg>
      </button>
      <button class="btn-icon" id="btn-options" aria-label="Options" aria-expanded="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="5" r="1" fill="currentColor"/><circle cx="12" cy="12" r="1" fill="currentColor"/><circle cx="12" cy="19" r="1" fill="currentColor"/></svg>
      </button>
    </div>

    <div class="score-viewport" id="score-viewport">
      <div id="score-container"></div>
      <div class="score-placeholder hidden" id="score-placeholder">Loading…</div>
    </div>

    <!-- Transport -->
    <div class="transport">
      <div class="transport-left">
        <button class="btn-play" id="btn-play" aria-label="Play">
          <svg id="icon-play"  viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>
          <svg id="icon-pause" viewBox="0 0 24 24" fill="currentColor" class="hidden"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
        </button>
        <button class="btn-stop" id="btn-stop" aria-label="Stop">
          <svg viewBox="0 0 24 24" fill="currentColor"><rect x="4" y="4" width="16" height="16"/></svg>
        </button>
      </div>

      <div class="transport-mid">
        <select id="tempo-slider" aria-label="Speed"><option value="25">25%</option><option value="50">50%</option><option value="60">60%</option><option value="70">70%</option><option value="75">75%</option><option value="80">80%</option><option value="90">90%</option><option value="100" selected>100%</option><option value="110">110%</option><option value="120">120%</option><option value="125">125%</option><option value="150">150%</option></select>
      </div>

      <div class="transport-right">
        <div class="hand-btns">
          <button class="btn-tag active" data-hand="both"  aria-pressed="true">Both</button>
          <button class="btn-tag"        data-hand="right" aria-pressed="false">R</button>
          <button class="btn-tag"        data-hand="left"  aria-pressed="false">L</button>
        </div>
        <button class="btn-tag" id="btn-loop"       aria-pressed="false">Loop</button>
        <span   class="loop-range" id="loop-range">—</span>
        <button class="btn-tag btn-sm" id="btn-loop-clear" aria-label="Clear loop">✕</button>
      </div>
    </div>

    <!-- Keyboard -->
    <div class="keyboard-strip">
      <canvas id="keyboard-canvas"></canvas>
    </div>

  </div><!-- /practice-layout -->

  <!-- Landscape right column -->
  <div class="ctrl-col" id="ctrl-col">
    <div class="ctrl-sect">
      <button class="btn-play" id="btn-play-ls" aria-label="Play" onclick="App.play()">
        <svg id="icon-play-ls"  viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>
        <svg id="icon-pause-ls" viewBox="0 0 24 24" fill="currentColor" class="hidden"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
      </button>
      <button class="btn-stop" id="btn-stop-ls" aria-label="Stop" onclick="App.stop()">
        <svg viewBox="0 0 24 24" fill="currentColor"><rect x="4" y="4" width="16" height="16"/></svg>
      </button>
    </div>
    <div class="ctrl-sect">
      <div class="ctrl-lbl">Speed</div>
      <select id="tempo-slider-ls"><option value="25">25%</option><option value="50">50%</option><option value="60">60%</option><option value="70">70%</option><option value="75">75%</option><option value="80">80%</option><option value="90">90%</option><option value="100" selected>100%</option><option value="110">110%</option><option value="120">120%</option><option value="125">125%</option><option value="150">150%</option></select>
    </div>
    <div class="ctrl-sect">
      <div class="ctrl-lbl">Hand</div>
      <div class="ctrl-hand">
        <button class="btn-tag active" data-hand="both"  aria-pressed="true">⇄</button>
        <button class="btn-tag"        data-hand="right" aria-pressed="false">R</button>
        <button class="btn-tag"        data-hand="left"  aria-pressed="false">L</button>
      </div>
    </div>
    <div class="ctrl-sect">
      <button class="btn-tag" id="btn-loop-ls" aria-pressed="false">Loop</button>
      <button class="btn-tag" id="btn-loop-clear-ls">✕</button>
      <span class="ctrl-val" id="loop-range-ls">—</span>
    </div>
  </div>

  <!-- Side options panel -->
  <div class="side-panel hidden" id="side-panel" role="dialog" aria-label="Options">
    <div class="side-panel-inner">
      <div class="side-panel-header">
        <span class="side-panel-title">Options</span>
        <button class="btn-icon" id="btn-panel-close" aria-label="Close">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>

      <div class="side-section">
        <div class="side-label">Zoom</div>
        <div class="side-row">
          <button class="opt-item" id="opt-zoom-out">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="8" y1="11" x2="14" y2="11"/></svg>
            Smaller
          </button>
          <button class="opt-item" id="opt-zoom-in">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="11" y1="8" x2="11" y2="14"/><line x1="8" y1="11" x2="14" y2="11"/></svg>
            Larger
          </button>
        </div>
      </div>

      <div class="side-section">
        <div class="side-label">Hand</div>
        <div class="side-row hand-btns-panel">
          <button class="btn-tag active" data-hand="both"  aria-pressed="true">Both</button>
          <button class="btn-tag"        data-hand="right" aria-pressed="false">Right</button>
          <button class="btn-tag"        data-hand="left"  aria-pressed="false">Left</button>
        </div>
      </div>

      <div class="side-section">
        <div class="side-label">Speed</div>
        <div class="side-row" style="gap:10px">
          <select id="tempo-slider-panel"><option value="25">25%</option><option value="50">50%</option><option value="60">60%</option><option value="70">70%</option><option value="75">75%</option><option value="80">80%</option><option value="90">90%</option><option value="100" selected>100%</option><option value="110">110%</option><option value="120">120%</option><option value="125">125%</option><option value="150">150%</option></select>
        </div>
      </div>

      <div class="side-section">
        <div class="side-label">Extras</div>
        <button class="opt-item" id="opt-countin">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
          <span id="opt-countin-label">Count-in: Off</span>
        </button>
        <button class="opt-item" id="opt-listen">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 1a3 3 0 00-3 3v8a3 3 0 006 0V4a3 3 0 00-3-3z"/><path d="M19 10v2a7 7 0 01-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
          <span id="opt-listen-label">Listen mode: Off</span>
        </button>
        <div class="opt-divider"></div>
        <button class="opt-item" id="opt-export">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          Export MusicXML
        </button>
      </div>
    </div>
  </div>
  <div class="side-panel-overlay hidden" id="side-panel-overlay"></div>

</div>

<!-- ═══════════ MODAL: Import ═══════════ -->
<div id="modal-import" class="modal-overlay hidden" role="dialog" aria-modal="true">
  <div class="modal">
    <div class="modal-header">
      <h2>Import Piece</h2>
      <button class="btn-icon" id="btn-import-close" aria-label="Close">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="modal-body">
      <div class="drop-zone" id="drop-zone">
        <svg class="drop-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
        <p>Drop a MusicXML file here</p>
        <p class="drop-sub">.xml or .mxl</p>
        <button class="btn-primary" id="btn-browse">Browse files</button>
        <input type="file" id="file-input" accept=".xml,.mxl" class="hidden" aria-label="Select file"/>
      </div>
      <div class="prog-bar hidden" id="prog-bar"><div class="prog-fill" id="prog-fill"></div></div>
      <p id="import-status" style="font-size:12px;color:var(--text-dim);margin-top:8px;text-align:center"></p>
    </div>
  </div>
</div>

<!-- ═══════════ MODAL: Edit piece ═══════════ -->
<div id="modal-piece" class="modal-overlay hidden" role="dialog" aria-modal="true">
  <div class="modal modal-wide">
    <div class="modal-header">
      <h2 id="modal-piece-title">Edit Piece</h2>
      <button class="btn-icon" id="btn-piece-close" aria-label="Close">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="modal-body">
      <div class="form-row"><label>Title</label><input type="text" id="pf-title"/></div>
      <div class="form-row"><label>Composer</label><input type="text" id="pf-composer"/></div>
      <div class="form-row"><label>Difficulty</label>
        <select id="pf-difficulty">
          <option value="1">1 — Beginner</option><option value="2">2 — Easy</option>
          <option value="3" selected>3 — Intermediate</option>
          <option value="4">4 — Advanced</option><option value="5">5 — Expert</option>
        </select>
      </div>
      <div class="form-row"><label>Tags</label><input type="text" id="pf-tags" placeholder="classical, Bach…"/></div>
    </div>
    <div class="modal-footer">
      <button class="btn-danger" id="btn-piece-delete">Delete</button>
      <div class="modal-footer-right">
        <button class="btn-secondary" id="btn-piece-cancel">Cancel</button>
        <button class="btn-primary"   id="btn-piece-save">Save</button>
      </div>
    </div>
  </div>
</div>

<div id="toast-wrap" class="toast-wrap"></div>

<script src="js/db.js?v=20260614095056"></script>
<script src="js/parser.js?v=20260614095056"></script>
<script src="js/score.js?v=20260614095056"></script>
<script src="js/keyboard.js?v=20260614095056"></script>
<script src="js/player.js?v=20260614095056"></script>
<script src="js/practice.js?v=20260614095056"></script>
<script src="js/pieces.js?v=20260614095056"></script>
<script src="js/app.js?v=20260614095056"></script>
</body>
</html>
